name: tests

on:
  pull_request:
    paths:
      - 'Formula/**'
      - 'script/**'
      - 'test/**'
      - .github/workflows/tests.yml
  push:
    branches: [main]
    paths:
      - 'Formula/**'
      - 'script/**'
      - 'test/**'
      - .github/workflows/tests.yml

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  generator:
    name: Test the wawarden formula generator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew and tap this repository
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          printf '%s\n' "$HOMEBREW_PREFIX/sbin" "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          brew update
          taps="$(brew --repository)/Library/Taps/dortort"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew trust --tap dortort/tap

      - name: Check the scripts with shellcheck
        run: shellcheck script/wawarden-formula test/wawarden-formula.sh

      - name: Test the generator
        run: test/wawarden-formula.sh

      - name: Audit a generated formula
        run: |
          script/wawarden-formula 1.2.3 test/fixtures/v1.2.3.SHA256SUMS > Formula/wawarden.rb
          brew audit --strict --formula dortort/tap/wawarden

  changes:
    name: Find the changed formulae
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      formulae: ${{ steps.changes.outputs.formulae }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List the added and modified formulae
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base=$BEFORE
          fi
          formulae=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'Formula/*.rb' |
            sed -n 's|^Formula/\([a-z0-9][a-z0-9@._+-]*\)\.rb$|dortort/tap/\1|p' | paste -sd ' ' -)
          echo "formulae: ${formulae:-none}"
          echo "formulae=$formulae" >> "$GITHUB_OUTPUT"

  formulae:
    name: Audit, install and test on ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.formulae != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel, ubuntu-24.04]
    env:
      FORMULAE: ${{ needs.changes.outputs.formulae }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew and tap this repository
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            printf '%s\n' "$HOMEBREW_PREFIX/sbin" "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          fi
          brew update
          taps="$(brew --repository)/Library/Taps/dortort"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew trust --tap dortort/tap

      - name: Check the style of the formulae
        run: |
          read -ra formulae <<< "$FORMULAE"
          brew style --formula "${formulae[@]}"

      - name: Audit the formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          read -ra formulae <<< "$FORMULAE"
          brew audit --strict --online --formula "${formulae[@]}"

      - name: Install the formulae
        run: |
          read -ra formulae <<< "$FORMULAE"
          brew install --formula "${formulae[@]}"

      - name: Test the formulae
        run: |
          read -ra formulae <<< "$FORMULAE"
          brew test "${formulae[@]}"
